services:
  - type: web
    name: data-formulator-whatsapp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 300 --bind 0.0.0.0:$PORT servidor_online:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: DATA_FORMULATOR_HOME
        value: /tmp/data_formulator
      - key: WORKSPACE_BACKEND
        value: local
      - key: DF_ALLOW_PLUGINS
        value: '1'
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DISABLE_DISPLAY_KEYS
        value: 'true'
      - key: WEB_ADMIN_USER
        value: admin
      - key: WEB_ADMIN_PASSWORD
        sync: false
      - key: NVIDIA_ENABLED
        value: 'true'
      - key: NVIDIA_ENDPOINT
        value: openai
      - key: NVIDIA_API_BASE
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODELS
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-service-account.json
      - key: WHATSAPP_ENABLED
        value: 'false'
      - key: WHATSAPP_RESTORE_FROM_GOOGLE
        value: 'true'

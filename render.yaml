services:
  - type: web
    name: chatbot-obras-enxuto
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn --workers 1 --threads 2 --timeout 300 --bind 0.0.0.0:$PORT servidor_chatbot:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: HOST
        value: 0.0.0.0
      - key: DATA_FORMULATOR_HOME
        value: /tmp/data_formulator
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: WEB_ADMIN_USER
        value: admin
      - key: WEB_ADMIN_PASSWORD
        sync: false
      - key: NVIDIA_ENABLED
        value: 'true'
      - key: NVIDIA_ENDPOINT
        value: openai
      - key: NVIDIA_API_BASE
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODELS
        value: nvidia/nemotron-3-ultra-550b-a55b
      - key: NVIDIA_API_KEY
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-service-account.json
      - key: GOOGLE_SPREADSHEET_ID
        sync: false
      - key: WHATSAPP_SHEET_NAMES
        value: ''
      - key: WHATSAPP_RESTORE_FROM_GOOGLE
        value: 'true'
      - key: WHATSAPP_MEMORY_HOURS
        value: '24'
      - key: WHATSAPP_ENABLED
        value: 'false'
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
